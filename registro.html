<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Club Cinépolis - Registro</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        header { background-color: #0b1c2c; color: white; text-align: center; padding: 20px 0; }
        nav { background-color: #f7ca18; display: flex; justify-content: center; padding: 10px; }
        nav a { color: #0b1c2c; text-decoration: none; margin: 0 15px; font-weight: bold; font-size: 18px; }
        nav a:hover { color: white; }
        main { padding: 20px; max-width: 1000px; margin: 0 auto; text-align: center; }
        footer { background-color: #0b1c2c; color: white; text-align: center; padding: 15px 0; margin-top: 40px; }
        
        /* Diseño específico para el formulario */
        .formulario-club { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 350px; margin: 0 auto; text-align: left; }
        .formulario-club h3 { text-align: center; color: #0b1c2c; }
        .formulario-club label { font-weight: bold; color: #333; font-size: 14px; }
        .formulario-club input { width: 90%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; }
        .formulario-club button { background-color: #0b1c2c; color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; width: 100%; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <h1>Cinépolis</h1>
        <p>La Capital del Cine</p>
    </header>

    <nav>
        <a href="index.html">Cartelera</a>
        <a href="estrenos.html">Próximos Estrenos</a>
        <a href="registro.html">Registro Club</a>
    </nav>

    <main>
        <h2>Únete a Club Cinépolis</h2>
        <p>Llena tus datos para obtener tu tarjeta y empezar a acumular puntos.</p>

        <div class="formulario-club">
            <h3>Formulario de Registro</h3>
            <form action="index.html">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
                
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" placeholder="ejemplo@correo.com" required>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" placeholder="10 dígitos" required>

                <label for="fecha_nac">Fecha de Nacimiento:</label>
                <input type="date" id="fecha_nac" required>
                
                <label for="password">Crea una Contraseña:</label>
                <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
                
                <button type="submit">Registrarme</button>
            </form>
        </div>
    </main>

    <footer>
        <p>Axel osmar aguirre ontiveros 5-i 0481</p>
    </footer>

</body>
</html>
